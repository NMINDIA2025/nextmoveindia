<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next Move India LMS</title>
<style>
:root{--ink:#14213d;--muted:#718096;--line:#e8edf4;--bg:#f6f8fc;--card:#fff;--yellow:#ffd23f;--purple:#7257ff;--green:#18a874;--blue:#3d7cff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink)}button{font:inherit}.app{display:flex;min-height:100vh}.sidebar{width:255px;background:#111a2c;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 25px}.logo{width:43px;height:43px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;color:#111;font-weight:950;font-size:21px;box-shadow:0 8px 20px #0003}.brand b{font-size:14px}.brand span{display:block;color:#93a0b5;font-size:11px;margin-top:2px}.role{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#8996aa;padding:0 10px 8px;font-weight:800}.nav button{width:100%;border:0;background:transparent;color:#aeb9ca;padding:12px 12px;border-radius:12px;text-align:left;cursor:pointer;margin:2px 0;font-weight:650}.nav button:hover,.nav button.active{background:#202d45;color:#fff}.nav button.active{box-shadow:inset 3px 0 0 var(--yellow)}.bottom{position:absolute;bottom:18px;left:14px;right:14px}.switch{width:100%;border:1px solid #31405a;background:#18243a;color:#fff;border-radius:12px;padding:10px;cursor:pointer}.main{margin-left:255px;width:calc(100% - 255px);padding:26px 30px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.13em;color:var(--purple);text-transform:uppercase}.title{font-size:30px;font-weight:900;margin:3px 0}.sub{color:var(--muted);font-size:13px}.avatar{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:13px;font-size:13px;font-weight:800}.view{display:none}.view.active{display:block}.hero{border-radius:24px;padding:25px;background:linear-gradient(135deg,#121d31,#2d4165);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-70px;background:#ffd23f22}.hero h2{margin:0 0 7px;font-size:22px}.hero p{margin:0;color:#cbd4e2;font-size:13px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--yellow);color:#111}.ghost{background:#fff;color:var(--ink)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(5,1fr)}.card,.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 8px 26px #1c2d4a0a}.metric .label{font-size:11px;color:var(--muted);font-weight:750}.metric .num{font-size:27px;font-weight:900;margin-top:7px}.metric .trend{font-size:10px;color:var(--green);font-weight:800;margin-top:5px}.two{grid-template-columns:1.45fr 1fr;margin-top:15px}.section{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h3{margin:0;font-size:15px}.class{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #edf1f6;border-radius:13px;margin:8px 0}.time{width:48px;font-size:12px;font-weight:900}.grow{flex:1}.grow b{display:block;font-size:13px}.grow span{font-size:11px;color:var(--muted)}.pill{font-size:10px;font-weight:900;padding:5px 8px;border-radius:99px;background:#e8f8f0;color:#08784e}.warning{background:#fff4db;color:#9a6500}.blue{background:#eaf0ff;color:#3158b8}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 8px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;color:#8793a5;letter-spacing:.05em}.tiles{grid-template-columns:repeat(3,1fr)}.tile h3{font-size:14px;margin:0 0 6px}.big{font-size:26px;font-weight:900}.progress{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:72%;background:var(--yellow)}.quick{display:flex;gap:9px;flex-wrap:wrap}.quick .btn{background:#f3f5f9}.mobilebar{display:none}.toast{position:fixed;right:22px;bottom:22px;background:#111a2c;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:20;font-size:12px;box-shadow:0 12px 35px #0003}
@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{display:none}.main{margin:0;width:100%;padding:18px 15px 78px}.top{margin-bottom:17px}.title{font-size:24px}.avatar{display:none}.stats{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:1fr}.hero{padding:20px;align-items:flex-start;flex-direction:column}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111a2c;padding:8px;z-index:10;gap:5px}.mobilebar button{flex:1;border:0;background:transparent;color:#aeb9ca;padding:8px 3px;border-radius:9px;font-size:10px}.mobilebar button.active{background:#202d45;color:#fff}.table{min-width:620px}.card.tablewrap{overflow:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">N</div><div><b>Next Move India</b><span>LMS • School OS</span></div></div>
  <div class="role">Workspace</div>
  <div class="nav" id="sideNav"></div>
  <div class="bottom"><button class="switch" onclick="toast('Role switching will be connected to secure login')">⇄ Switch workspace</button></div>
</aside>
<main class="main">
  <div class="top"><div><div class="eyebrow">Next Move India LMS</div><div class="title" id="title">Admin Dashboard</div><div class="sub" id="subtitle">Run your school from one clean workspace.</div></div><div class="avatar" id="user">👤 Admin</div></div>
  <div id="views"></div>
</main>
</div>
<div class="mobilebar" id="mobileNav"></div>
<div class="toast" id="toast"></div>
<script>
const data={
admin:{title:'Admin Dashboard',sub:'Run your school from one clean workspace.',icon:'⌂',nav:[
['dashboard','Dashboard'],['leads','Leads & Follow-up'],['teachers','Teachers'],['students','Students'],['classes','Classes & Timetable'],['payments','Payments'],['materials','Teaching Materials'],['progress','Attendance & Progress']],
},
teacher:{title:'Teacher Dashboard',sub:'Everything you need for today’s teaching.',icon:'◉',nav:[
['teacherHome','My Dashboard'],['myclasses','My Classes'],['mystudents','My Students'],['materialsT','Materials'],['attendance','Attendance'],['teacherProgress','Student Progress']],
},
student:{title:'Student Dashboard',sub:'Learn, practise, play and collect achievements.',icon:'★',nav:[
['studentHome','Home'],['mycourse','My Course'],['practice','Practice & Games'],['schedule','My Schedule'],['achievements','Achievements'],['certificates','Certificates']]
}};
let role='admin',current='dashboard';
function navFor(r){return data[r].nav}
function renderNav(){const items=navFor(role);document.getElementById('sideNav').innerHTML=items.map(x=>'<button class="'+(x[0]===current?'active':'')+'" onclick="go(\''+x[0]+'\')">'+data[role].icon+' &nbsp; '+x[1]+'</button>').join('');document.getElementById('mobileNav').innerHTML=items.slice(0,5).map(x=>'<button class="'+(x[0]===current?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
function go(id){current=id;renderNav();document.querySelectorAll('.screen').forEach(x=>x.style.display=x.id===id?'block':'none');const item=navFor(role).find(x=>x[0]===id);document.getElementById('title').textContent=item?item[1]:data[role].title;document.getElementById('subtitle').textContent=data[role].sub}
function setRole(r){role=r;current=data[r].nav[0][0];document.getElementById('user').textContent=r==='admin'?'👤 Admin':r==='teacher'?'👩‍🏫 Teacher':'🎓 Student';build();go(current)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function build(){
let html='';
if(role==='admin')html=adminScreens();
if(role==='teacher')html=teacherScreens();
if(role==='student')html=studentScreens();
document.getElementById('views').innerHTML=html;renderNav();go(current)
}
function adminScreens(){return `
<section id="dashboard" class="screen">
<div class="hero"><div><h2>Good morning 👋</h2><p>Your leads, teachers, classes and students are ready for action.</p></div><button class="btn primary" onclick="go('leads')">Open Lead Center</button></div>
<div class="grid stats">
<div class="card metric"><div class="label">NEW LEADS</div><div class="num">12</div><div class="trend">Today</div></div>
<div class="card metric"><div class="label">DEMOS TODAY</div><div class="num">4</div><div class="trend">2 need confirmation</div></div>
<div class="card metric"><div class="label">FOLLOW-UPS</div><div class="num">7</div><div class="trend">Action required</div></div>
<div class="card metric"><div class="label">ACTIVE STUDENTS</div><div class="num">18</div><div class="trend">+3 this month</div></div>
<div class="card metric"><div class="label">PAYMENTS PENDING</div><div class="num">3</div><div class="trend">₹19,497</div></div></div>
<div class="grid two"><div class="card"><div class="section"><h3>Today’s Classes</h3><button class="btn primary" onclick="go('classes')">View all</button></div>
<div class="class"><b class="time">10:00</b><div class="grow"><b>Smart Speakers Story World</b><span>Tripti • 6 students</span></div><span class="pill">Upcoming</span></div>
<div class="class"><b class="time">17:00</b><div class="grow"><b>Young Leaders Public Speaking</b><span>NMI Team • 5 students</span></div><span class="pill">Upcoming</span></div>
<div class="class"><b class="time">19:00</b><div class="grow"><b>Tiny Talkers</b><span>NMI Team • 7 students</span></div><span class="pill">Upcoming</span></div></div>
<div class="card"><div class="section"><h3>Today’s Action</h3><span class="pill warning">7 tasks</span></div>
<div class="class">☎️<div class="grow"><b>Call new parents</b><span>4 enquiries waiting</span></div></div>
<div class="class">✓<div class="grow"><b>Confirm demos</b><span>2 parents</span></div></div>
<div class="class">₹<div class="grow"><b>Payment follow-up</b><span>3 pending</span></div></div></div></div></section>
<section id="leads" class="screen"><div class="card tablewrap"><div class="section"><div><h3>Lead Command Center</h3><span class="sub">From enquiry to enrollment</span></div><button class="btn primary" onclick="toast('New lead form will connect to your live lead source')">+ New Lead</button></div><table class="table"><thead><tr><th>Parent</th><th>Child</th><th>Course</th><th>Status</th><th>Demo</th><th>Action</th></tr></thead><tbody>
<tr><td>Ramprasad Rao</td><td>Dhuythi • 12</td><td>Public Speaking</td><td><span class="pill blue">New</span></td><td>Not set</td><td>Call</td></tr>
<tr><td>P. J. Pahnavani</td><td>Khyathi • 7</td><td>Smart Speakers</td><td><span class="pill blue">New</span></td><td>Not set</td><td>Call</td></tr>
<tr><td>Ankita Yadav</td><td>Anvika • 10</td><td>Young Leaders</td><td><span class="pill warning">Contacted</span></td><td>Tomorrow</td><td>Confirm</td></tr>
<tr><td>Sonam Yadav</td><td>Anvika • 10</td><td>Young Leaders</td><td><span class="pill">Demo Scheduled</span></td><td>Today</td><td>Confirm</td></tr>
</tbody></table></div></section>
<section id="teachers" class="screen"><div class="grid tiles">
<div class="tile"><h3>👩‍🏫 Tripti Shukla</h3><p class="sub">Online Tutor • Active</p><div class="big">6</div><span class="sub">assigned students</span></div>
<div class="tile"><h3>🎤 Public Speaking Team</h3><p class="sub">Active teaching pool</p><div class="big">8</div><span class="sub">assigned students</span></div>
<div class="tile"><h3>📅 Demo Pool</h3><p class="sub">Ready for new assignments</p><div class="big">4</div><span class="sub">demos this week</span></div></div></section>
<section id="students" class="screen"><div class="card tablewrap"><div class="section"><h3>Students</h3><button class="btn primary" onclick="toast('Student onboarding will be connected here')">+ Add Student</button></div><table class="table"><thead><tr><th>Student</th><th>Course</th><th>Teacher</th><th>Progress</th><th>Status</th></tr></thead><tbody><tr><td>Aadya</td><td>Smart Speakers</td><td>Tripti</td><td>72%</td><td><span class="pill">Active</span></td></tr><tr><td>Sree</td><td>Young Leaders</td><td>NMI Team</td><td>54%</td><td><span class="pill">Active</span></td></tr><tr><td>Dhuythi</td><td>Public Speaking</td><td>NMI Team</td><td>38%</td><td><span class="pill blue">New</span></td></tr></tbody></table></div></section>
<section id="classes" class="screen"><div class="grid two"><div class="card"><div class="section"><h3>Class Schedule</h3><button class="btn primary" onclick="toast('Class creation will be connected here')">+ Class</button></div><div class="class"><b class="time">10:00</b><div class="grow"><b>Smart Speakers Story World</b><span>Tripti • 6 students</span></div><button class="btn primary" onclick="toast('Meet link ready')">Join</button></div><div class="class"><b class="time">17:00</b><div class="grow"><b>Young Leaders</b><span>NMI Team • 5 students</span></div><button class="btn primary" onclick="toast('Meet link ready')">Join</button></div></div><div class="card"><h3>Class Workspace</h3><p class="sub">Each class will hold its Google Meet, materials, attendance, notes and progress.</p><div class="quick"><button class="btn" onclick="toast('Meet integration')">Meet</button><button class="btn" onclick="toast('Materials')">Materials</button><button class="btn" onclick="toast('Attendance')">Attendance</button></div></div></div></section>
<section id="payments" class="screen"><div class="card tablewrap"><div class="section"><h3>Payments & Enrollments</h3><span class="pill warning">3 pending</span></div><table class="table"><thead><tr><th>Parent</th><th>Student</th><th>Course</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>Parent A</td><td>Aadya</td><td>Smart Speakers</td><td>₹9,499</td><td><span class="pill warning">Pending</span></td></tr><tr><td>Parent B</td><td>Sree</td><td>Young Leaders</td><td>₹9,999</td><td><span class="pill">Paid</span></td></tr></tbody></table></div></section>
<section id="materials" class="screen"><div class="grid tiles"><div class="tile"><h3>📚 Course Materials</h3><p class="sub">PPTs, worksheets and activities</p><button class="btn primary" onclick="toast('Materials library')">Open Library</button></div><div class="tile"><h3>🎤 Speaking Activities</h3><p class="sub">Voice, phonics and public speaking</p><button class="btn primary" onclick="toast('Activity library')">Open</button></div><div class="tile"><h3>🎮 Practice Games</h3><p class="sub">Student-ready interactive practice</p><button class="btn primary" onclick="toast('Games library')">Open</button></div></div></section>
<section id="progress" class="screen"><div class="grid tiles"><div class="tile"><h3>Attendance</h3><div class="big">94%</div><p class="sub">School average</p></div><div class="tile"><h3>Progress Reviews</h3><div class="big">8</div><p class="sub">due this week</p></div><div class="tile"><h3>Certificates</h3><div class="big">5</div><p class="sub">ready to issue</p></div></div></section>`;}
function teacherScreens(){return `
<section id="teacherHome" class="screen"><div class="hero"><div><h2>Good morning, Teacher 👋</h2><p>Your next class, students and teaching tools are here.</p></div><button class="btn primary" onclick="go('myclasses')">View Classes</button></div><div class="grid stats"><div class="card metric"><div class="label">TODAY’S CLASSES</div><div class="num">3</div></div><div class="card metric"><div class="label">MY STUDENTS</div><div class="num">11</div></div><div class="card metric"><div class="label">ATTENDANCE DUE</div><div class="num">2</div></div><div class="card metric"><div class="label">PROGRESS DUE</div><div class="num">3</div></div><div class="card metric"><div class="label">MATERIALS</div><div class="num">24</div></div></div><div class="card" style="margin-top:15px"><div class="section"><h3>Next Class</h3><span class="pill">10:00 AM</span></div><div class="class"><div class="grow"><b>Smart Speakers Story World</b><span>6 students • Room 1</span></div><button class="btn primary" onclick="toast('Meet link ready')">Join Meet</button></div></div></section>
<section id="myclasses" class="screen"><div class="card"><h3>My Classes</h3><div class="class"><b class="time">10:00</b><div class="grow"><b>Smart Speakers Story World</b><span>6 students</span></div><button class="btn primary" onclick="toast('Meet link ready')">Join</button></div><div class="class"><b class="time">17:00</b><div class="grow"><b>Young Leaders</b><span>5 students</span></div><button class="btn primary" onclick="toast('Meet link ready')">Join</button></div></div></section>
<section id="mystudents" class="screen"><div class="card tablewrap"><h3>My Students</h3><table class="table"><thead><tr><th>Student</th><th>Course</th><th>Attendance</th><th>Progress</th></tr></thead><tbody><tr><td>Aadya</td><td>Smart Speakers</td><td>96%</td><td>72%</td></tr><tr><td>Riya</td><td>Smart Speakers</td><td>91%</td><td>65%</td></tr><tr><td>Khyathi</td><td>Young Leaders</td><td>88%</td><td>54%</td></tr></tbody></table></div></section>
<section id="materialsT" class="screen"><div class="grid tiles"><div class="tile"><h3>📚 Today’s PPTs</h3><p class="sub">Your assigned class material</p><button class="btn primary" onclick="toast('Opening teaching material')">Open</button></div><div class="tile"><h3>🎯 Activities</h3><p class="sub">Games, speaking and practice</p><button class="btn primary" onclick="toast('Opening activities')">Open</button></div><div class="tile"><h3>📝 Class Notes</h3><p class="sub">Save notes after every class</p><button class="btn primary" onclick="toast('Class notes')">Open</button></div></div></section>
<section id="attendance" class="screen"><div class="card"><h3>Attendance</h3><p class="sub">Mark students present after each class.</p><button class="btn primary" onclick="toast('Attendance form ready')">Mark Today’s Attendance</button></div></section>
<section id="teacherProgress" class="screen"><div class="card"><h3>Student Progress</h3><p class="sub">Update speaking, confidence, participation and assignments.</p><button class="btn primary" onclick="toast('Progress form ready')">Update Progress</button></div></section>`;}
function studentScreens(){return `
<section id="studentHome" class="screen"><div class="hero"><div><h2>Hi, Aarav! 👋</h2><p>Ready for today’s learning adventure?</p></div><button class="btn primary" onclick="go('schedule')">See Schedule</button></div><div class="grid tiles"><div class="tile"><h3>🎤 Speaking Practice</h3><p class="sub">Build confidence and voice.</p><button class="btn primary" onclick="toast('Practice starting')">Start</button></div><div class="tile"><h3>🎮 Practice Games</h3><p class="sub">Learn through challenges.</p><button class="btn primary" onclick="go('practice')">Play</button></div><div class="tile"><h3>🏆 Achievements</h3><p class="sub">3 badges unlocked.</p><button class="btn primary" onclick="go('achievements')">View</button></div></div><div class="card" style="margin-top:15px"><div class="section"><h3>Course Progress</h3><b>72%</b></div><div class="progress"><i></i></div><p class="sub">Smart Speakers Story World</p></div></section>
<section id="mycourse" class="screen"><div class="card"><h3>My Course</h3><p class="sub">Smart Speakers Story World</p><div class="progress"><i></i></div><p class="sub">18 lessons • 13 completed</p></div></section>

build();
</script>
</body>
</html>

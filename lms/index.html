<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Next Move India LMS</title>
<style>
:root{--ink:#1f1530;--muted:#76708a;--line:#ece7f3;--bg:#faf7fc;--card:#fff;--orange:#ff7a1a;--yellow:#ffc72c;--pink:#ff3d8b;--plum:#2a0f3a;--plum2:#3b1550;--green:#12a36b;--blue:#4d7cff;--red:#e0475b;--r:16px;--shadow:0 10px 30px #2a0f3a12}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pink)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:248px;background:linear-gradient(180deg,#2a0f3a,#1d0a2a);color:#fff;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:30;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--yellow),var(--orange) 60%,var(--pink));display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;box-shadow:0 8px 22px #ff7a1a40}
.brand b{display:block;font-size:14px}.brand span{font-size:11px;color:#b9a6c9}
.navgrp{font-size:10px;letter-spacing:.14em;color:#8f78a3;font-weight:800;text-transform:uppercase;padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#d8cce4;padding:10px 12px;border-radius:11px;text-align:left;font-weight:600;margin:1px 0}
.nav button .ic{width:20px;text-align:center;font-size:15px}
.nav button:hover{background:#ffffff12}
.nav button.on{background:linear-gradient(90deg,#ff7a1a33,#ff3d8b22);color:#fff;box-shadow:inset 3px 0 0 var(--yellow)}
.nav .bd{margin-left:auto;background:var(--pink);color:#fff;border-radius:99px;font-size:10px;padding:1px 7px;font-weight:800}
.sidefoot{margin-top:auto;padding-top:14px}
.me{display:flex;gap:10px;align-items:center;background:#ffffff10;border-radius:13px;padding:10px}
.me .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--yellow),var(--pink));display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.me b{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}.me span{font-size:10px;color:#b9a6c9;text-transform:capitalize}
.me button{margin-left:auto;background:transparent;border:0;color:#d8cce4;font-size:16px}
/* main */
.main{margin-left:248px;width:calc(100% - 248px);min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:#faf7fcf2;backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:850}
.topbar .sub{color:var(--muted);font-size:12px;margin-top:2px}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:240px;color:var(--muted);cursor:pointer}
.search kbd{margin-left:auto;font-size:10px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#faf7fc}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--ink)}
.chip.ok{color:var(--green)}.chip.bad{color:var(--red)}
.page{padding:22px 28px 60px;max-width:1500px}
/* controls */
.btn{color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:700;display:inline-flex;gap:7px;align-items:center;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #2a0f3a14}
.btn.pri{background:linear-gradient(135deg,var(--yellow),var(--orange));border-color:transparent;color:#2a1200}
.btn.pink{background:linear-gradient(135deg,var(--orange),var(--pink));border-color:transparent;color:#fff}
.btn.red{color:var(--red);border-color:#f3c9d0}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.btn.wa{background:#25d366;border-color:transparent;color:#06361a}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
input,select,textarea{border:1px solid #e3dcee;border-radius:11px;padding:9px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #ff7a1a55;border-color:var(--orange)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:15px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.muted{color:var(--muted)}.sm{font-size:12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{position:relative;overflow:hidden;cursor:pointer}
.kpi .l{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kpi .n{font-size:30px;font-weight:900;letter-spacing:-.04em;margin-top:6px}
.kpi .s{font-size:11px;color:var(--muted);margin-top:2px}
.kpi:after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#ff7a1a22,#ff7a1a00 70%)}
.cols2{grid-template-columns:1.5fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}
.hero{border-radius:22px;padding:24px 28px;color:#fff;background:linear-gradient(120deg,#ff8a1f,#ff4f7b 60%,#d9328f);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;box-shadow:0 16px 40px #ff4f7b30}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.92}
/* table */
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:#fcfaff;position:sticky;top:0;cursor:pointer;user-select:none}
tbody tr{cursor:pointer}tbody tr:hover{background:#fff8f2}
tr:last-child td{border-bottom:0}
.empty{padding:34px;text-align:center;color:var(--muted)}
/* badges */
.b{display:inline-block;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;background:#efeaf6;color:#5b4a73;white-space:nowrap}
.b.g{background:#e0f6ec;color:#0b7a4f}.b.o{background:#fff0dc;color:#a35a00}.b.r{background:#fde4e8;color:#b02c40}.b.bl{background:#e6edff;color:#2f55c0}.b.p{background:#ffe3f0;color:#b31a62}.b.y{background:#fff6cc;color:#7a5d00}
.prog{height:7px;background:#efeaf6;border-radius:99px;overflow:hidden;min-width:70px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink));border-radius:99px}
/* tabs / seg */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--plum);color:#fff}
/* kanban */
.kan{display:flex;gap:12px;overflow:auto;padding-bottom:12px;align-items:flex-start}
.kcol{flex:0 0 250px;background:#f4eff9;border-radius:15px;padding:10px;min-height:120px}
.kcol.over{outline:2px dashed var(--orange);background:#fff3e6}
.kcol h4{margin:2px 4px 10px;display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:0 3px 10px #2a0f3a0d}
.kcard:hover{border-color:var(--orange)}.kcard b{display:block}.kcard .sm{margin-top:2px}
.kcard.dragging{opacity:.4}
/* funnel */
.fun{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.fun .bar{height:12px;border-radius:99px;background:#f1ecf7;overflow:hidden}.fun .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--pink))}
/* list items */
.li{display:flex;gap:11px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;margin:7px 0;background:#fff;cursor:pointer}
.li:hover{border-color:var(--orange)}
.li .t{width:56px;font-weight:850;font-size:12px;text-align:center;flex:none}
.li b{display:block}.li span.sm{display:block}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px;min-height:140px}
.day.today{border-color:var(--orange);box-shadow:0 0 0 2px #ff7a1a33}
.day h5{margin:0 0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ev{font-size:11px;border-radius:8px;padding:5px 7px;margin-bottom:5px;background:#fff0dc;color:#7a3f00;cursor:pointer;line-height:1.3}
.ev.demo{background:#ffe3f0;color:#8c1650}.ev.fu{background:#e6edff;color:#2f4fa8}.ev.done{opacity:.55;text-decoration:line-through}
/* drawer */
.ov{position:fixed;inset:0;background:#1d0a2a88;z-index:60;display:none;justify-content:flex-end}
.ov.on{display:flex}
.drawer{background:#fff;width:min(560px,100%);height:100%;overflow:auto;padding:20px 22px 30px;box-shadow:-20px 0 60px #1d0a2a55;animation:slide .18s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.drawer h2{margin:0;font-size:20px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fg label>*:not(span){margin-top:5px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.fg .full{grid-column:1/-1}
.drawer .act{position:sticky;bottom:-30px;background:linear-gradient(transparent,#fff 30%);padding:18px 0 4px;margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px}
.tabs button{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--orange)}
.hist div{padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.sync{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;color:#0b7a4f;background:#e0f6ec;border-radius:99px;padding:3px 10px}
.sync.no{color:#8c6a00;background:#fff6cc}
/* palette */
.pal{position:fixed;inset:0;background:#1d0a2a88;z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.pal.on{display:flex}
.palbox{background:#fff;border-radius:18px;width:min(600px,94%);padding:14px;box-shadow:0 30px 80px #0006}
.palbox .res{max-height:50vh;overflow:auto;margin-top:8px}
.palbox .li{margin:4px 0}
.toast{position:fixed;right:20px;bottom:20px;background:var(--plum);color:#fff;border-radius:12px;padding:12px 16px;z-index:99;display:none;box-shadow:0 12px 30px #0005;max-width:360px}
.mbar{display:none}
/* auth */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#2a0f3a,#5a1a6b 55%,#ff3d8b)}
.gate .box{background:#fff;border-radius:24px;padding:30px;width:min(420px,100%);box-shadow:0 30px 90px #0006}
.gate .tag{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--pink)}
.gate h2{margin:6px 0 4px;font-size:26px}
.gate input{margin-bottom:10px}
.seat{font-size:12px;color:var(--red);min-height:18px;margin-top:10px}
.pill-lang{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;font-weight:800;font-size:12px}
@media(max-width:1000px){.cols2,.cols3{grid-template-columns:1fr}.cal{grid-template-columns:repeat(2,1fr)}.search{min-width:0}.search span.tx{display:none}}
@media(max-width:760px){.side{display:none}.main{margin:0;width:100%}.topbar{padding:12px 14px}.page{padding:14px 12px 90px}.fg{grid-template-columns:1fr}.topbar h1{font-size:18px}.chip.hide-m{display:none}
.mbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--plum);z-index:40;padding:6px;gap:2px;overflow:auto}
.mbar button{flex:1;min-width:64px;border:0;background:transparent;color:#cdbbe0;padding:7px 4px;border-radius:10px;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.mbar button .ic{font-size:16px}.mbar button.on{background:#ffffff1f;color:#fff}.cal{grid-template-columns:1fr}.kcol{flex-basis:220px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">N</div><div><b>Next Move India</b><span>Learn • Lead • Rise</span></div></div>
    <div class="nav" id="nav"></div>
    <div class="sidefoot"><div class="me"><div class="av" id="meAv">N</div><div style="min-width:0"><b id="meName">…</b><span id="meRole"></span></div><button title="Sign out" onclick="signOut()">⎋</button></div></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div><h1 id="pgTitle">Dashboard</h1><div class="sub" id="pgSub"></div></div>
      <div class="spacer"></div>
      <div class="search" onclick="openPalette()"><span>🔎</span><span class="tx">Search everything</span><kbd>Ctrl K</kbd></div>
      <button class="pill-lang" id="langBtn" onclick="toggleLang()">हिं</button>
      <span class="chip hide-m" id="liveChip">● Live</span>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>
<div class="mbar" id="mbar"></div>
<div class="ov" id="ov" onclick="if(event.target===this)closeDrawer()"><div class="drawer" id="drawer"></div></div>
<div class="pal" id="pal" onclick="if(event.target===this)closePalette()"><div class="palbox"><input id="palQ" placeholder="Search leads, students, teachers, classes…" oninput="runPalette()"><div class="res" id="palRes"></div></div></div>
<div class="toast" id="toast"></div>
<div class="gate" id="gate" style="display:none"><div class="box">
  <div class="tag">NEXT MOVE INDIA LMS</div><h2>Welcome back 👋</h2><p class="muted" style="margin:0 0 18px">Sign in to your secure school workspace.</p>
  <input id="gEmail" type="email" placeholder="Email address" autocomplete="username">
  <input id="gPass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn pri" style="width:100%;justify-content:center" onclick="doLogin()">Sign in</button>
  <button class="btn" style="width:100%;justify-content:center;margin-top:8px" onclick="doSignup()">Create parent account</button>
  <div class="seat" id="gMsg"></div>
  <div class="sm muted">Your password is handled by Supabase Authentication.</div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= Connection ================= */
const SUPABASE_URL='https://qsibsuhejremcbzpmhwt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_xUiOIEr5U88-8DfQorcuWw_siREim5y';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

/* ================= Helpers ================= */
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function fmtDate(v){if(!v)return '—';const d=new Date(String(v).length<=10?v+'T00:00:00':v);return isNaN(d)?esc(v):d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'})}
function fmtDT(v){if(!v)return '';const d=new Date(v);return isNaN(d)?'':d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function money(n){return n==null||n===''?'—':'₹'+Number(n).toLocaleString('en-IN')}
function toast(s,ms){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',ms||2600)}
function titleCase(s){return String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function initials(s){return String(s||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?'}
function waLink(phone,parent,child){let d=String(phone||'').replace(/\D/g,'');if(d.length===10)d='91'+d;const m='Hello '+(parent||'')+', this is Next Move India'+(child?' regarding '+child:'')+'. ';return d?'https://wa.me/'+d+'?text='+encodeURIComponent(m):'#'}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
function toCSV(rows,cols){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return [cols.map(c=>q(c.label)).join(',')].concat(rows.map(r=>cols.map(c=>q(c.csv?c.csv(r):r[c.k])).join(','))).join('\n')}

/* ================= Language (English / हिन्दी) ================= */
const HI={Dashboard:'डैशबोर्ड',Leads:'लीड्स','Lead Pipeline':'लीड पाइपलाइन',Students:'विद्यार्थी',Classes:'कक्षाएं',Attendance:'उपस्थिति',Materials:'सामग्री',Tasks:'कार्य',Payments:'भुगतान',Teachers:'शिक्षक','Team & Access':'टीम और एक्सेस','Sheet Sync':'शीट सिंक',Home:'होम','My Classes':'मेरी कक्षाएं','My Children':'मेरे बच्चे','Add':'जोड़ें',Save:'सहेजें',Delete:'हटाएं',Cancel:'रद्द करें',Search:'खोजें',Status:'स्थिति',Today:'आज','Good morning':'सुप्रभात','Follow-ups due':'फॉलो-अप बाकी','New leads':'नए लीड','Active students':'सक्रिय विद्यार्थी','Pending payments':'बकाया भुगतान','Today\'s classes':'आज की कक्षाएं','Open tasks':'खुले कार्य',Progress:'प्रगति',Course:'कोर्स',Phone:'फ़ोन',Notes:'टिप्पणियां',Calendar:'कैलेंडर',List:'सूची',Board:'बोर्ड'};
let LANG=(()=>{try{return localStorage.getItem('nmi_lang')||'en'}catch(e){return 'en'}})();
const T=s=>LANG==='hi'&&HI[s]?HI[s]:s;
function toggleLang(){LANG=LANG==='en'?'hi':'en';try{localStorage.setItem('nmi_lang',LANG)}catch(e){}
  if(S.user)sb.from('profiles').update({language:LANG}).eq('id',S.user.id).then(()=>{});
  $('langBtn').textContent=LANG==='en'?'हिं':'EN';renderNav();render()}

/* ================= State & permissions ================= */
const S={user:null,profile:null,role:'student',d:{},view:'dashboard',ui:{},loaded:false};
const isAdmin=()=>S.role==='admin';
const isStaff=()=>['admin','counselor','teacher'].includes(S.role);
const isFamily=()=>['parent','student'].includes(S.role);
function canEdit(ent){
  const r=S.role;if(r==='admin')return true;
  if(r==='counselor')return ['leads','tasks'].includes(ent);
  if(r==='teacher')return ['classes','attendance','tasks'].includes(ent);
  return false;
}
function canDelete(ent){return isAdmin()}

/* ================= Status vocab & colours ================= */
const LEAD_ST=[['new','New','bl'],['contacted','Contacted','y'],['interested','Interested','o'],['call_back_later','Call back later','y'],['demo_scheduled','Demo scheduled','p'],['demo_rescheduled','Demo rescheduled','p'],['demo_completed','Demo completed','g'],['follow_up','Follow-up (fee shared)','o'],['enrolled','Enrolled','g'],['not_interested','Not interested','r'],['not_reachable','Not reachable','r']];
const LEAD_LABEL=Object.fromEntries(LEAD_ST.map(x=>[x[0],x[1]]));

const TABLES_BY_ROLE={
 admin:['leads','students','teachers','classes','materials','tasks','payments','attendance','profiles','courses','demos'],

const LIMIT=2000;
async function loadTable(t){
  let q=sb.from(t).select('*').limit(LIMIT);
  const e=ENT[t];
  if(e&&e.order)q=q.order(e.order,{ascending:!!e.asc,nullsFirst:false});
  else if(t==='profiles')q=q.order('created_at');
  else if(t==='courses')q=q.order('name');
  const {data,error}=await q;
  if(error){S.err=S.err||{};S.err[t]=error.message;return []}
  return data||[];
}
async function loadAll(quiet){
  S.err={};
  const list=TABLES_BY_ROLE[S.role]||[];
  const res=await Promise.all(list.map(loadTable));
  list.forEach((t,i)=>S.d[t]=res[i]);
  S.loaded=true;S.last=new Date();
  S.map={};for(const t of list){S.map[t]={};for(const r of S.d[t])S.map[t][r.id]=r}
  const bad=Object.keys(S.err);
  const chip=$('liveChip');
  chip.className='chip hide-m '+(bad.length?'bad':'ok');
  chip.textContent=bad.length?'⚠ '+bad.length+' problem(s)':'● Live · '+S.last.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  chip.title=bad.length?bad.map(t=>t+': '+S.err[t]).join('\n'):'Data refreshes automatically every minute and whenever you save.';
  updateBadges();if(!quiet)render();
}
const D=t=>S.d[t]||[];
const byId=(t,id)=>(S.map&&S.map[t]&&S.map[t][id])||null;
function teacherName(id){const t=byId('teachers',id);return t?t.full_name:''}
function staffList(){return D('profiles').filter(p=>['admin','counselor','teacher'].includes(p.role))}
function myTeacherId(){const t=D('teachers').find(x=>x.profile_id===(S.user&&S.user.id));return t?t.id:null}

/* ================= Generic save / delete ================= */
async function saveRecord(ent,id,payload){
  const t=ent;let res;
  if(id)res=await sb.from(t).update(payload).eq('id',id).select().maybeSingle();
  else res=await sb.from(t).insert(payload).select().maybeSingle();
  if(res.error){toast('Could not save: '+res.error.message,5000);return null}
  if(id&&!res.data){toast('Nothing was saved — you may not have permission for this record.',5000);return null}
  await loadAll(true);return res.data||true;
}
async function deleteRecord(ent,id){
  if(!confirm('Delete this '+ENT[ent].label.toLowerCase()+'? This cannot be undone.'))return false;
  const {error}=await sb.from(ent).delete().eq('id',id);
  if(error){toast('Could not delete: '+error.message,5000);return false}
  await loadAll(true);return true;
}

/* ================= Drawer + generic editor ================= */
function openDrawer(html){$('drawer').innerHTML=html;$('ov').classList.add('on')}
function closeDrawer(){$('ov').classList.remove('on');$('drawer').innerHTML='';render()}
function optionsFor(f,val){
  const sel=v=>String(v)===String(val??'')?' selected':'';
  let o=[];
  if(f.t==='sel')o=f.o;
  else if(f.t==='course'){o=[['','—']].concat(D('courses').map(c=>[c.name,c.name]));if(val&&!o.some(x=>x[0]===val))o.push([val,val])}
  else if(f.t==='teacher'){o=[['','—']].concat(D('teachers').map(c=>[c.id,c.full_name]))}
  else if(f.t==='staff'){o=[['','Unassigned']].concat(staffList().map(p=>[p.id,(p.full_name||p.email)+' ('+p.role+')']));if(!isAdmin()&&S.user)o=[['',''],[S.user.id,'Me']]}
  else if(f.t==='student'){o=[['','Choose student…']].concat(D('students').map(c=>[c.id,c.full_name+(c.student_code?' • '+c.student_code:'')]))}
  return o.map(x=>'<option value="'+esc(x[0])+'"'+sel(x[0])+'>'+esc(x[1])+'</option>').join('');
}
function fieldHTML(f,r,ro){
  const v=r[f.k]!=null?r[f.k]:(f.def!=null&&!r.id?f.def:'');
  const dis=ro||(f.adminOnly&&!isAdmin())?' disabled':'';
  let inner;
  if(['sel','course','teacher','staff','student'].includes(f.t))inner='<select data-k="'+f.k+'"'+dis+'>'+optionsFor(f,v)+'</select>';
  else if(f.t==='area')inner='<textarea data-k="'+f.k+'" rows="3"'+dis+'>'+esc(v)+'</textarea>';
  else if(f.t==='bool')inner='<select data-k="'+f.k+'" data-bool="1"'+dis+'><option value="true"'+(v===true||v==='true'?' selected':'')+'>Yes</option><option value="false"'+(v===false||v==='false'?' selected':'')+'>No</option></select>';
  else if(f.t==='date')inner='<input type="date" data-k="'+f.k+'" value="'+esc(v)+'"'+dis+'>';
  else if(f.t==='num')inner='<input type="number" step="any" data-k="'+f.k+'" value="'+esc(v)+'"'+dis+'>';
  else inner='<input data-k="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+dis+'>';
  return '<label class="'+(f.w?'full':'')+'"><span>'+esc(f.l)+(f.req?' *':'')+'</span>'+inner+'</label>';
}
function collect(ent){
  const e=ENT[ent],p={};
  for(const f of e.fields){
    const el=document.querySelector('#drawer [data-k="'+f.k+'"]');if(!el||el.disabled)continue;
    let v=el.value;
    if(f.t==='num')v=v===''?null:Number(v);
    else if(el.dataset.bool)v=v==='true';
    else v=String(v).trim()===''?null:String(v).trim();
    p[f.k]=v;
  }
  return p;
}
function editor(ent,id,preset,extraTop,extraBottom){
  const e=ENT[ent],r=id?(byId(ent,id)||{}):(preset||{});const ro=!canEdit(ent);
  const missing=e.fields.filter(f=>f.req&&!r[f.k]&&id);
  openDrawer('<div class="dh"><div><div class="sm muted">'+esc(e.label)+'</div><h2>'+esc(id?e.title(r):'New '+e.label.toLowerCase())+'</h2></div><button class="btn sm" onclick="closeDrawer()">✕</button></div>'
   +'<div class="row" style="margin-bottom:12px"><span class="sync" title="Edit here or in the Google Sheet tab &quot;'+esc(e.tab)+'&quot; — both stay in step.">⇄ Synced with Google Sheet</span>'+(ro?'<span class="b y">View only</span>':'')+'</div>'
   +(extraTop||'')
   +'<div class="fg">'+e.fields.map(f=>fieldHTML(f,r,ro)).join('')+'</div>'
   +(extraBottom||'')
   +(ro?'':'<div class="act"><button class="btn pri" onclick="submitEditor(\''+ent+'\','+(id?'\''+id+'\'':'null')+')">💾 Save</button>'+(id&&canDelete(ent)?'<button class="btn red" onclick="removeFromEditor(\''+ent+'\',\''+id+'\')">Delete</button>':'')+'<button class="btn" onclick="closeDrawer()">Cancel</button></div>'));
}
async function submitEditor(ent,id){
  const e=ENT[ent],p=collect(ent);
  for(const f of e.fields)if(f.req&&!p[f.k]){toast('Please fill in: '+f.l);return}
  if(ent==='leads'&&!p.parent_name&&!p.phone&&!p.child_name){toast('Add at least a name or phone number');return}
  if(ent==='leads'){const bad=(p.status==='not_interested'||p.status==='not_reachable');if(!bad&&'lost_reason' in p)p.lost_reason=null;
    if(!id&&!isAdmin())p.assigned_to=S.user.id;if(!id)p.source='manual'}
  if(ent==='tasks'&&!id&&!p.assignee_id)p.assignee_id=S.user.id;
  if(ent==='classes'&&p.teacher_id===null)p.teacher_name=null;
  if(ent==='students'&&'teacher_id' in p){}
  const ok=await saveRecord(ent,id,p);if(ok){toast('Saved ✓');closeDrawer()}
}

function listView(ent,opts){
  opts=opts||{};const e=ENT[ent];const u=(S.ui[ent]=S.ui[ent]||{q:'',f:'',sort:null,dir:1});
  const rows=filterRows(ent);

   +(e.filter?'<select style="width:auto" onchange="S.ui[\''+ent+'\'].f=this.value;refreshRows(\''+ent+'\')"><option value="">All</option>'+e.filter.o.map(o=>'<option value="'+esc(o[0])+'"'+(u.f===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>':'')
   +(opts.toolbar||'')
   +'<button class="btn" onclick="exportEnt(\''+ent+'\')">⬇ CSV</button>'
   +(canAdd?'<button class="btn pri" onclick="addRecord(\''+ent+'\')">＋ '+T('Add')+' '+esc(e.label.toLowerCase())+'</button>':'')
   +'</div><div class="tw" id="tw_'+ent+'">'+tableHTML(ent,rows)+'</div>'
   +'<div class="sm muted" style="margin-top:8px"><span class="sync">⇄ Two-way</span> &nbsp;Every change here appears in the Google Sheet tab “'+esc(e.tab)+'”, and edits made in that tab come back here.</div>';
}
function filterRows(ent){
  const e=ENT[ent],u=S.ui[ent]||{q:'',f:''};let rows=D(ent);
  if(u.f&&e.filter)rows=rows.filter(r=>String(r[e.filter.k])===u.f);
  const q=(u.q||'').toLowerCase().trim();
  if(q)rows=rows.filter(r=>Object.values(r).some(v=>v!=null&&typeof v!=='object'&&String(v).toLowerCase().includes(q)));
  if(u.sort){const k=u.sort,d=u.dir;rows=rows.slice().sort((a,b)=>{const x=a[k],y=b[k];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*d})}
  return rows;
}
function tableHTML(ent,rows){
  const e=ENT[ent],u=S.ui[ent]||{};
  if(!rows.length)return '<div class="empty">'+(S.err&&S.err[ent]?'Could not load: '+esc(S.err[ent])+'<br><span class="sm">If this says “relation does not exist”, run phase 3 in Supabase.</span>':'Nothing here yet.')+'</div>';
  return '<table><thead><tr>'+e.cols.map(c=>'<th onclick="sortBy(\''+ent+'\',\''+c.k+'\')">'+esc(c.l)+(u.sort===c.k?(u.dir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr></thead><tbody>'
   +rows.slice(0,400).map(r=>'<tr onclick="openRecord(\''+ent+'\',\''+r.id+'\')">'+e.cols.map(c=>'<td>'+(c.f?c.f(r):esc(r[c.k]??'—'))+'</td>').join('')+'</tr>').join('')
   +'</tbody></table>'+(rows.length>400?'<div class="empty sm">Showing 400 of '+rows.length+' — use search to narrow down.</div>':'');
}
function refreshRows(ent){const el=$('tw_'+ent);if(el)el.innerHTML=tableHTML(ent,filterRows(ent))}
function sortBy(ent,k){const u=S.ui[ent];if(u.sort===k)u.dir=-u.dir;else{u.sort=k;u.dir=1}refreshRows(ent)}
function exportEnt(ent){const e=ENT[ent];download('nmi-'+ent+'-'+todayStr()+'.csv',toCSV(filterRows(ent),e.cols.map(c=>({label:c.l,k:c.k}))))}
function addRecord(ent){
  if(ent==='classes')return editor('classes',null,{class_date:todayStr()});
  if(ent==='tasks')return editor('tasks',null,{assignee_id:S.user.id});
  if(ent==='leads')return editor('leads',null,{assigned_to:S.user.id});
  editor(ent,null,{});
}
function openRecord(ent,id){
  if(ent==='leads')return openLead(id);
  if(ent==='students')return openStudent(id);
  if(ent==='classes')return openClass(id);
  editor(ent,id);
}

/* ---- Import leads (paste from Google Sheets or CSV file) ---- */
function openImport(){
  openDrawer('<div class="dh"><div><div class="sm muted">Leads</div><h2>Import leads</h2></div><button class="btn sm" onclick="closeDrawer()">✕</button></div>'
  +'<p class="muted">Already connected to Google Sheets? The <b>Sheet Sync</b> page sets up automatic two-way sync. This is for a one-time bulk import.</p>'
  +'<label class="sm"><b>Option 1 — Choose a CSV file</b></label><input type="file" accept=".csv,text/csv" onchange="importFile(event)" style="margin:6px 0 14px">'
  +'<label class="sm"><b>Option 2 — Paste rows copied from Google Sheets</b> (include the header row)</label><textarea id="impText" rows="8" placeholder="Copy from Google Sheets, then press Ctrl+V here" style="margin-top:6px"></textarea>'
  +'<div class="act"><button class="btn pri" onclick="importText($(\'impText\').value)">Import pasted rows</button><button class="btn" onclick="closeDrawer()">Cancel</button></div><div id="impMsg" class="sm muted"></div>');
}
function csvParse(text){const rows=[];let row=[],cell='',q=false;text=String(text||'').replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];
    if(ch==='"'){if(q&&nx==='"'){cell+='"';i++}else q=!q}
    else if((ch===','||ch===';'||ch==='\t')&&!q){row.push(cell);cell=''}
    else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);cell='';if(row.some(v=>String(v).trim()!==''))rows.push(row);row=[]}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);if(row.some(v=>String(v).trim()!==''))rows.push(row)}return rows}
const normH=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function fld(o,...names){for(const n of names){const k=Object.keys(o).find(x=>normH(x)===normH(n));if(k)return String(o[k]||'').trim()}return ''}
function parseSheetTimestamp(v){const m=String(v||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);if(!m)return null;const p=n=>String(n||0).padStart(2,'0');return m[3]+'-'+p(m[2])+'-'+p(m[1])+'T'+p(m[4])+':'+p(m[5])+':'+p(m[6])+'+05:30'}
const leadKey=x=>String(x.phone||'').replace(/\D/g,'').slice(-10)+'|'+String(x.child_name||'').trim().toLowerCase();
async function importFile(e){const f=e.target.files&&e.target.files[0];if(f)importText(await f.text())}
async function importText(text){
  const msg=$('impMsg');const rows=csvParse(text);
  if(rows.length<2){msg.textContent='I could not find a header row plus lead rows. Please include the header row.';return}
  const H=rows[0];const recs=rows.slice(1).map(r=>Object.fromEntries(H.map((h,i)=>[h,r[i]||''])));
  const payload=recs.map(x=>{const ts=fld(x,'Timestamp','Inquiry Timestamp','Created At','created_at');
    return {parent_name:fld(x,'Parent Name','Parents Name','Parent'),phone:fld(x,'Phone','Mobile No','Mobile','Phone Number','WhatsApp'),child_name:fld(x,'Child Name','Childs Name','Student Name'),child_age:fld(x,'Child Age','Childs Age','Age')||null,city:fld(x,'City','Location'),
      status:normalizeLeadStatus(fld(x,'Pipeline Stage','Lead Status','Status')),interested_course:fld(x,'Interested Course','Course')||null,demo_date:fld(x,'Demo Date','Demo')||null,notes:fld(x,'Notes','Remark','Remarks')||null,source:'Google Sheet Import',
      created_at:parseSheetTimestamp(ts)||(Date.parse(ts)?new Date(ts).toISOString():new Date().toISOString())}}).filter(x=>x.parent_name||x.phone||x.child_name);
  if(!payload.length){msg.textContent='No usable rows found — check that the header row has names like Parent Name and Phone.';return}
  const seen=new Set(D('leads').map(leadKey));const fresh=payload.filter(x=>{const k=leadKey(x);if(seen.has(k))return false;seen.add(k);return true});
  if(!fresh.length){msg.textContent='These leads are already in the LMS — nothing new to add.';return}
  if(!isAdmin())fresh.forEach(x=>x.assigned_to=S.user.id);
  msg.textContent='Importing '+fresh.length+' lead(s)…';
  const {error}=await sb.from('leads').insert(fresh);
  if(error){msg.textContent='Import failed: '+error.message;return}
  await loadAll(true);toast(fresh.length+' new lead(s) imported ✓');closeDrawer();
}

  const present=att.filter(a=>['present','late'].includes(a.status)).length;

  const bottom='<div style="margin-top:18px"><div class="hd row" style="justify-content:space-between"><b>Payments</b>'+(canEdit('payments')?'<button class="btn sm" onclick="newPayment(\''+id+'\')">＋ Payment</button>':'')+'</div>'
   +(pays.length?pays.map(p=>'<div class="li" onclick="editor(\'payments\',\''+p.id+'\')"><div class="grow"><b>'+money(p.amount)+'</b><span class="sm muted">'+esc(p.package||p.course_name||'')+' · due '+fmtDate(p.due_date)+'</span></div>'+bd(effPay(p))+'</div>').join(''):'<div class="sm muted">No payments recorded.</div>')+'</div>'
   +'<div style="margin-top:18px"><b>Recent attendance</b>'+(att.length?att.slice(0,8).map(a=>'<div class="li" style="cursor:default"><div class="grow"><b>'+esc(a.class_title||'Class')+'</b><span class="sm muted">'+fmtDate(a.class_date)+'</span></div>'+bd(a.status)+'</div>').join(''):'<div class="sm muted">No attendance yet.</div>')+'</div>';
  editor('students',id,null,top,bottom);

/* ================= Classes: calendar + list, class drawer, attendance ================= */
function weekStart(off){const d=new Date(todayStr()+'T00:00:00');const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+7*(off||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
VIEWS.classes=()=>{
  const m=S.ui.classMode||'cal';
  const tb='<div class="seg"><button class="'+(m==='cal'?'on':'')+'" onclick="S.ui.classMode=\'cal\';render()">'+T('Calendar')+'</button><button class="'+(m==='list'?'on':'')+'" onclick="S.ui.classMode=\'list\';render()">'+T('List')+'</button></div>';
  if(m==='list')return listView('classes',{toolbar:tb});
  const off=S.ui.weekOff||0,ws=weekStart(off),t=todayStr();let days='';
  for(let i=0;i<7;i++){const ds=addDays(ws,i),d=new Date(ds+'T00:00:00');
    const cl=D('classes').filter(c=>c.class_date===ds).sort((a,b)=>String(a.class_time).localeCompare(String(b.class_time)));
    const fu=isStaff()&&S.role!=='teacher'?D('leads').filter(l=>l.next_follow_up===ds&&!['enrolled','not_interested'].includes(l.status)):[];
    days+='<div class="day'+(ds===t?' today':'')+'"><h5>'+d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})+'</h5>'
     +cl.map(c=>'<div class="ev'+(c.kind==='demo'||c.kind==='one_to_one'?' demo':'')+(c.status==='cancelled'||c.status==='completed'?' done':'')+'" onclick="openClass(\''+c.id+'\')"><b>'+esc(c.class_time||'')+'</b> '+esc(c.title)+(c.teacher_name?'<br><span style="opacity:.75">'+esc(c.teacher_name)+'</span>':'')+'</div>').join('')
     +(fu.length?'<div class="ev fu" onclick="S.ui.leadMode=\'list\';go(\'leads\')">📞 '+fu.length+' follow-up'+(fu.length>1?'s':'')+'</div>':'')+'</div>';}
  return '<div class="row" style="margin-bottom:12px"><div class="seg"><button onclick="S.ui.weekOff=(S.ui.weekOff||0)-1;render()">‹</button><button onclick="S.ui.weekOff=0;render()">Today</button><button onclick="S.ui.weekOff=(S.ui.weekOff||0)+1;render()">›</button></div><b>'+fmtDate(ws)+' – '+fmtDate(addDays(ws,6))+'</b><div class="spacer"></div>'+tb+(canEdit('classes')?'<button class="btn pri" onclick="addRecord(\'classes\')">＋ Class</button>':'')+'</div><div class="cal">'+days+'</div><div class="sm muted" style="margin-top:8px"><span class="sync">⇄ Two-way</span> Classes also live in the “LMS Classes” tab of your Google Sheet.</div>';
};
function openClass(id){
  const c=byId('classes',id);if(!c)return editor('classes',id);
  const att=D('attendance').filter(a=>a.class_id===id);
  const top='<div class="row" style="margin-bottom:12px">'+(c.meet_link?'<a class="btn pink" target="_blank" rel="noopener" href="'+esc(c.meet_link)+'" style="text-decoration:none">🎥 Join Google Meet</a>':'')+(isStaff()&&S.role!=='counselor'?'<button class="btn" onclick="openAttendance(\''+id+'\')">✅ Attendance ('+att.length+' marked)</button>':'')+'</div>';
  editor('classes',id,null,top,'');
}
VIEWS.attendance=()=>{
  const t=todayStr();
  const cl=D('classes').filter(c=>c.status!=='cancelled'&&c.class_date&&c.class_date<=addDays(t,1)).sort((a,b)=>String(b.class_date).localeCompare(String(a.class_date))).slice(0,40);
  return '<div class="card"><div class="hd"><h3>Choose a class to mark attendance</h3></div>'+(cl.map(c=>{const n=D('attendance').filter(a=>a.class_id===c.id).length;return '<div class="li" onclick="openAttendance(\''+c.id+'\')"><div class="t">'+fmtDate(c.class_date)+'</div><div class="grow"><b>'+esc(c.title)+'</b><span class="sm muted">'+esc([c.class_time,c.teacher_name,c.course_name].filter(Boolean).join(' • '))+'</span></div>'+(n?'<span class="b g">'+n+' marked</span>':'<span class="b o">Not marked</span>')+'</div>'}).join('')||'<div class="empty">No classes yet. Add one under Classes.</div>')+'</div>';
};
function classRoster(c){
  const st=D('students').filter(s=>s.status==='active'||D('attendance').some(a=>a.class_id===c.id&&a.student_id===s.id));
  const m=st.filter(s=>c.course_name&&s.course_name===c.course_name);return m.length?m:st;
}
function openAttendance(cid){
  const c=byId('classes',cid);if(!c)return;const roster=classRoster(c);
  const rows=roster.map(s=>{const a=D('attendance').find(x=>x.class_id===cid&&x.student_id===s.id);const cur=a?a.status:'';
    return '<div class="li" style="cursor:default"><div class="grow"><b>'+esc(s.full_name)+'</b><span class="sm muted">'+esc(s.course_name||'')+'</span></div><div class="row" style="gap:4px;flex-wrap:nowrap">'+['present','absent','late','excused'].map(k=>'<button class="btn sm" style="'+(cur===k?'background:'+({present:'#12a36b',absent:'#e0475b',late:'#e0a200',excused:'#4d7cff'}[k])+';color:#fff;border-color:transparent':'')+'" onclick="markAtt(\''+cid+'\',\''+s.id+'\',\''+k+'\')">'+esc(k==='present'?'P':k==='absent'?'A':k==='late'?'L':'E')+'</button>').join('')+'</div></div>'}).join('');
  openDrawer('<div class="dh"><div><div class="sm muted">Attendance · '+fmtDate(c.class_date)+'</div><h2>'+esc(c.title)+'</h2></div><button class="btn sm" onclick="closeDrawer()">✕</button></div>'
   +'<div class="row" style="margin-bottom:10px"><button class="btn pri" onclick="markAll(\''+cid+'\')">✓ Mark everyone present</button><button class="btn" onclick="openClass(\''+cid+'\')">← Class details</button></div><div class="sm muted" style="margin-bottom:6px">P = present · A = absent · L = late · E = excused. Sessions completed update automatically.</div>'
   +(rows||'<div class="empty">No students to show. Add students first.</div>'));
}
async function markAtt(cid,sid,status){
  const {error}=await sb.from('attendance').upsert({class_id:cid,student_id:sid,status},{onConflict:'class_id,student_id'});
  if(error){toast('Could not save: '+error.message,5000);return}
  await loadAll(true);openAttendance(cid);
}
async function markAll(cid){
  const c=byId('classes',cid);const rows=classRoster(c).map(s=>({class_id:cid,student_id:s.id,status:'present'}));
  if(!rows.length)return;const {error}=await sb.from('attendance').upsert(rows,{onConflict:'class_id,student_id'});
  if(error){toast('Could not save: '+error.message,5000);return}
  await loadAll(true);toast('Everyone marked present ✓');openAttendance(cid);
}

/* ================= Search palette ================= */
function openPalette(){$('pal').classList.add('on');$('palQ').value='';runPalette();setTimeout(()=>$('palQ').focus(),30)}
function closePalette(){$('pal').classList.remove('on')}
function runPalette(){
  const q=$('palQ').value.toLowerCase().trim();const out=[];
  const src=[['leads','🎯',r=>r.parent_name||r.phone,r=>[r.child_name,r.phone,r.status].filter(Boolean).join(' · '),'openLead'],['students','🎓',r=>r.full_name,r=>[r.student_code,r.course_name].filter(Boolean).join(' · '),'openStudent'],['teachers','👩‍🏫',r=>r.full_name,r=>r.subject||r.email,'tchr'],['classes','📅',r=>r.title,r=>fmtDate(r.class_date)+' '+(r.class_time||''),'openClass'],['materials','📚',r=>r.title,r=>r.course_name||'','mat']];
  if(q.length<2){$('palRes').innerHTML='<div class="empty sm">Type at least 2 letters — searches leads, students, teachers, classes and materials.</div>';return}
  for(const [t,ic,a,b,fn] of src)for(const r of D(t)){const hay=Object.values(r).filter(v=>v!=null&&typeof v!=='object').join(' ').toLowerCase();if(hay.includes(q))out.push([t,ic,a(r),b(r),fn,r.id]);if(out.length>40)break}
  $('palRes').innerHTML=out.slice(0,25).map(o=>'<div class="li" onclick="palGo(\''+o[0]+'\',\''+o[5]+'\')"><span>'+o[1]+'</span><div class="grow"><b>'+esc(o[2]||'—')+'</b><span class="sm muted">'+esc(o[3]||'')+'</span></div><span class="b">'+esc(ENT[o[0]].label)+'</span></div>').join('')||'<div class="empty sm">No matches.</div>';
}
function palGo(t,id){closePalette();openRecord(t,id)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(S.user)openPalette()}if(e.key==='Escape'){closePalette();if($('ov').classList.contains('on'))closeDrawer()}});
</script>
<script>
/* ================= Sign in / boot ================= */
async function doLogin(){const m=$('gMsg');m.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email:$('gEmail').value.trim(),password:$('gPass').value});m.textContent=error?error.message:''}
async function doSignup(){
  const email=$('gEmail').value.trim(),password=$('gPass').value,m=$('gMsg');
  if(!email||password.length<6){m.textContent='Enter your email and a password of at least 6 characters.';return}
  m.textContent='Creating account…';
  const {data,error}=await sb.auth.signUp({email,password});
  if(error){m.textContent=error.message;return}
  m.style.color='#12a36b';m.textContent=data.session?'Account created — you are signed in.':'Account created. Check your email to confirm, then sign in.';
}
async function signOut(){await sb.auth.signOut();S.user=null;S.loaded=false;S.d={};$('gate').style.display='flex'}
let booting=false;
async function boot(){
  if(booting)return;booting=true;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){$('gate').style.display='flex';return}
    $('gate').style.display='none';S.user=session.user;
    const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    S.profile=p||{full_name:session.user.email};S.role=(p&&p.active!==false&&p.role)||'student';
    if(p&&p.language&&!localStorage.getItem('nmi_lang')){LANG=p.language}
    $('langBtn').textContent=LANG==='en'?'हिं':'EN';
    $('meName').textContent=S.profile.full_name||session.user.email;$('meRole').textContent=S.role;$('meAv').textContent=initials(S.profile.full_name||session.user.email);
    const h=(location.hash||'').replace('#','');
    S.view=myNav().some(x=>x[0]===h)?h:'dashboard';
    renderNav();$('page').innerHTML='<div class="empty">Loading your workspace…</div>';
    await loadAll();
  }catch(e){console.error(e);$('page').innerHTML='<div class="card"><b>Something went wrong while loading.</b><p class="muted">'+esc(e.message||e)+'</p><button class="btn pri" onclick="location.reload()">Reload</button></div>'}
  finally{booting=false}
}
sb.auth.onAuthStateChange((ev,session)=>{if(ev==='SIGNED_OUT'){S.user=null;$('gate').style.display='flex'}else if(session&&(!S.user||ev==='SIGNED_IN'&&S.user.id!==session.user.id))setTimeout(boot,0)});
/* keep data fresh: changes made in the Google Sheet appear here within a minute */
setInterval(async()=>{
  if(!S.user||document.hidden||$('ov').classList.contains('on')||$('pal').classList.contains('on'))return;
  const a=document.activeElement;if(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))return;
  await loadAll(true);render();
},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user&&!$('ov').classList.contains('on'))loadAll(true).then(()=>{const a=document.activeElement;if(!(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)))render()})});
boot();
</script>

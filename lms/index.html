function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function formatDate(v){
  if(!v) return 'Not set';
  const d=new Date(v); if(Number.isNaN(d.getTime())) return escapeHtml(v);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
}
async function safeCount(table, filter){
  let q=supabaseClient.from(table).select('*',{count:'exact',head:true});
  if(filter) q=q.eq(filter[0],filter[1]);
  const {count,error}=await q;
  if(error) return null;
  return count ?? 0;
}

function togglePasteLeads(){
  const box=document.getElementById('pasteLeadBox');
  if(box) box.style.display=box.style.display==='none'?'block':'none';

function sheetRowsToObjects(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='');
  if(lines.length<2) return [];
  const splitLine=line=>line.split('\t');
  const headers=splitLine(lines[0]).map(x=>x.trim());
  return lines.slice(1).map(line=>{
    const vals=splitLine(line);
    return Object.fromEntries(headers.map((h,i)=>[h,vals[i]||'']));
  });
}
async function importPastedLeads(){
  const text=document.getElementById('leadPaste')?.value||'';
  const records=sheetRowsToObjects(text);
  if(records.length<1){toast('Paste the header row and at least one lead row');return}
  const payload=records.map(x=>{
    const timestamp=csvField(x,'Timestamp','Created At','created_at');
    const status=(csvField(x,'Status','Lead Status')||'new').toLowerCase().replace(/\s+/g,'_');
    return {
      parent_name:csvField(x,'Parent Name','Parent'),
      phone:csvField(x,'Phone','Mobile','Phone Number'),
      child_name:csvField(x,'Child Name','Student Name'),
      child_age:csvField(x,'Child Age','Age')||null,
      city:csvField(x,'City','Location'),
      status,
      demo_date:csvField(x,'Demo Date','Demo')||null,
      notes:csvField(x,'Notes','Remark','Remarks')||null,
      source:'Google Sheet Import',
      created_at:timestamp||new Date().toISOString()
    };
  }).filter(x=>x.parent_name||x.phone||x.child_name);
  if(!payload.length){toast('No usable lead rows found');return}
  const {data:existing,error:existingError}=await supabaseClient.from('leads').select('phone,created_at').limit(5000);
  if(existingError){toast('Could not check existing leads: '+existingError.message);return}
  const keys=new Set((existing||[]).map(x=>String(x.phone||'')+'|'+String(x.created_at||'')));
  const fresh=payload.filter(x=>!keys.has(String(x.phone||'')+'|'+String(x.created_at||'')));
  if(!fresh.length){toast('No new leads found. Existing records were kept safe.');return}
  let {error}=await supabaseClient.from('leads').insert(fresh);
  if(error){
    const fallback=fresh.map(x=>({parent_name:x.parent_name,phone:x.phone,child_name:x.child_name,child_age:x.child_age,city:x.city,status:x.status,demo_date:x.demo_date}));
    error=(await supabaseClient.from('leads').insert(fallback)).error;
  }
  if(error){toast('Import failed: '+error.message);return}
  toast(fresh.length+' new leads imported');
  document.getElementById('leadPaste').value='';
  togglePasteLeads();
  await refreshLeadCenter();
}
function csvParse(text){
  const rows=[]; let row=[]; let cell=''; let quote=false;
  text=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const ch=text[i], nx=text[i+1];
    if(ch==='"'){
      if(quote && nx==='"'){cell+='"';i++;}
      else quote=!quote;
    } else if((ch===',' || ch===';' || ch==='\t') && !quote){
      row.push(cell); cell='';
    } else if((ch==='\n' || ch==='\r') && !quote){
      if(ch==='\r' && nx==='\n') i++;
      row.push(cell); cell='';
      if(row.some(v=>String(v).trim()!=='')) rows.push(row);
      row=[];
    } else {
      cell+=ch;
    }
  }
  if(cell!=='' || row.length){
    row.push(cell);
    if(row.some(v=>String(v).trim()!=='')) rows.push(row);
  }
  return rows;
}
function normHeader(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function csvField(obj,...names){for(const n of names){const k=Object.keys(obj).find(x=>normHeader(x)===normHeader(n));if(k)return obj[k]?.trim()||''}return ''}
async function importLeadCSV(e){
  const file=e.target.files?.[0]; if(!file)return;
  toast('Reading your Google Sheet export…');
  const rows=csvParse(await file.text()); if(rows.length<2){toast('CSV has no lead rows');return}
  const headers=rows[0], records=rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]||''])));
  const payload=records.map(x=>{
    const timestamp=csvField(x,'Timestamp','Created At','created_at');
    const status=(csvField(x,'Status','Lead Status')||'new').toLowerCase().replace(/\s+/g,'_');
    return {
      parent_name:csvField(x,'Parent Name','Parent'),
      phone:csvField(x,'Phone','Mobile','Phone Number'),
      child_name:csvField(x,'Child Name','Student Name'),
      child_age:csvField(x,'Child Age','Age')||null,
      city:csvField(x,'City','Location'),
      status,
      demo_date:csvField(x,'Demo Date','Demo')||null,
      notes:csvField(x,'Notes','Remark','Remarks')||null,
      source:'Google Sheet Import',
      created_at:timestamp||new Date().toISOString()
    };
  }).filter(x=>x.parent_name||x.phone||x.child_name);
  if(!payload.length){toast('No usable lead rows found');return}
  const {data:existing,error:existingError}=await supabaseClient.from('leads').select('phone,created_at').limit(5000);
  if(existingError){console.error(existingError);toast('Could not check existing leads: '+existingError.message);return}
  const keys=new Set((existing||[]).map(x=>String(x.phone||'')+'|'+String(x.created_at||'')));
  const fresh=payload.filter(x=>!keys.has(String(x.phone||'')+'|'+String(x.created_at||'')));
  if(!fresh.length){toast('No new leads found. Existing records were kept safe.');return}
  let {error}=await supabaseClient.from('leads').insert(fresh);
  if(error){
    const fallback=fresh.map(x=>({parent_name:x.parent_name,phone:x.phone,child_name:x.child_name,child_age:x.child_age,city:x.city,status:x.status,demo_date:x.demo_date}));
    const retry=await supabaseClient.from('leads').insert(fallback);
    error=retry.error;
  }
  if(error){console.error(error);toast('Import failed: '+error.message);return}
  toast(fresh.length+' new leads imported');
  await refreshLeadCenter();
}

<div id="authGate" style="position:fixed;inset:0;background:rgba(7,16,30,.88);backdrop-filter:blur(12px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px">
<div style="width:min(420px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 30px 90px #0006">

<h2 style="margin:7px 0 5px;font-size:25px">Welcome back 👋</h2>
<p style="margin:0 0 20px;color:#7b8799;font-size:13px">Sign in to your secure school workspace.</p>
<input id="authEmail" type="email" placeholder="Email address" style="width:100%;padding:12px;border:1px solid #e3e8f0;border-radius:11px;margin-bottom:9px;font:inherit">
<input id="authPassword" type="password" placeholder="Password" style="width:100%;padding:12px;border:1px solid #e3e8f0;border-radius:11px;margin-bottom:12px;font:inherit">
<button class="btn primary" style="width:100%" onclick="loginLMS()">Sign in</button>
<button class="btn ghost" style="width:100%;margin-top:8px" onclick="signupLMS()">Create account</button>
<div id="authMsg" style="font-size:12px;color:#d04a4a;margin-top:12px;min-height:18px"></div>
<div style="font-size:10px;color:#9aa5b5;margin-top:12px">Your password is handled by Supabase Authentication.</div>
</div></div>
<script>
async function loginLMS(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,msg=document.getElementById('authMsg');msg.textContent='Signing in...';const {error}=await supabaseClient.auth.signInWithPassword({email,password});msg.textContent=error?error.message:'';}
async function signupLMS(){
  const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,msg=document.getElementById('authMsg');
  if(!email||password.length<6){msg.textContent='Enter an email and a password of at least 6 characters.';return;}
  msg.textContent='Creating account...';
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error){msg.textContent=error.message;return;}
  msg.textContent=data.session?'Account created. You are signed in.':'Account created. Check your email if confirmation is enabled, then sign in.';
}
async function loadLMSUser(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){document.getElementById('authGate').style.display='flex';return;}
  document.getElementById('authGate').style.display='none';
  currentUser=session.user;
  const {data:profile}=await supabaseClient.from('profiles').select('full_name,role').eq('id',session.user.id).maybeSingle();
  authRole=profile&&profile.role?profile.role:'student';
  role=authRole;
  document.getElementById('user').textContent='👤 '+(profile&&profile.full_name?profile.full_name:session.user.email);
  setRole(authRole);
}
supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session)loadLMSUser();else document.getElementById('authGate').style.display='flex';});loadLMSUser();
</script>
